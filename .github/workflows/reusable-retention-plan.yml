name: Reusable Release Retention Plan

on:
  workflow_call:
    outputs:
      plan_artifact_id:
        description: Immutable artifact ID for the generated retention plan
        value: ${{ jobs.plan.outputs.plan_artifact_id }}
      plan_sha256:
        description: SHA-256 digest of retention-plan.json
        value: ${{ jobs.plan.outputs.plan_sha256 }}
    inputs:
      manifest:
        description: Path to the caller repository's release manifest
        required: true
        type: string
      policy:
        description: Path to the caller repository's retention policy
        required: true
        type: string
      inventory:
        description: Optional JSON inventory of the product's R2 objects
        required: false
        type: string
        default: ""
      as_of:
        description: Optional UTC timestamp used for a reproducible plan
        required: false
        type: string
        default: ""
      rclone_remote:
        description: Optional rclone remote root, for example cf_r2:keyflowy-apps/
        required: false
        type: string
        default: ""
      r2_prefix:
        description: Optional product object prefix, for example kindow/
        required: false
        type: string
        default: ""
      runs_on:
        description: JSON array of runner labels, or a single runner label; retention runs on a fixed self-hosted Linux home runner whose rclone configuration is runner-local
        required: false
        type: string
        default: "[\"self-hosted\",\"Linux\",\"home\"]"

jobs:
  plan:
    outputs:
      plan_artifact_id: ${{ steps.publish.outputs.artifact-id }}
      plan_sha256: ${{ steps.digest.outputs.sha256 }}
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    permissions:
      contents: read
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Checkout shared planner
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Keyflowy/app_release_infrastructure
          path: .release-infrastructure
          # job.workflow_sha is the immutable commit that supplied this
          # reusable workflow; do not resolve the planner from a mutable branch.
          ref: ${{ job.workflow_sha }}

      - name: Validate runner-local rclone configuration
        if: ${{ inputs.inventory == '' && inputs.rclone_remote != '' }}
        env:
          RCLONE_REMOTE: ${{ inputs.rclone_remote }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_ENVIRONMENT:-}" != "self-hosted" ]] || [[ "${RUNNER_OS:-}" != "Linux" ]]; then
            echo "retention planning requires the fixed self-hosted Linux home runner." >&2
            exit 1
          fi
          if ! command -v rclone >/dev/null 2>&1; then
            echo "rclone is not installed on the fixed self-hosted runner." >&2
            exit 1
          fi
          remotes="$(rclone listremotes)"
          for remote in "cf_r2:" "gd_admin:"; do
            if ! printf '%s\n' "$remotes" | grep -Fxq "$remote"; then
              echo "runner-local rclone configuration is missing the $remote remote." >&2
              exit 1
            fi
          done
          if ! rclone lsd "$RCLONE_REMOTE" >/dev/null 2>&1; then
            echo "storage target $RCLONE_REMOTE is not accessible from the configured runner." >&2
            exit 1
          fi

      - name: Prepare complete R2 inventory
        id: inventory
        env:
          INVENTORY_PATH: ${{ inputs.inventory }}
          RCLONE_REMOTE: ${{ inputs.rclone_remote }}
          R2_PREFIX: ${{ inputs.r2_prefix }}
        run: |
          set -euo pipefail

          if [ -n "$INVENTORY_PATH" ]; then
            if [ -z "$RCLONE_REMOTE" ] || [ -z "$R2_PREFIX" ]; then
              echo "inventory requires both rclone_remote and r2_prefix." >&2
              exit 1
            fi
            echo "path=$INVENTORY_PATH" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$RCLONE_REMOTE" ] && [ -z "$R2_PREFIX" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$RCLONE_REMOTE" ] || [ -z "$R2_PREFIX" ]; then
            echo "rclone_remote and r2_prefix must be provided together." >&2
            exit 1
          fi
          if ! command -v rclone >/dev/null 2>&1; then
            echo "rclone is required on the planning runner when an R2 target is configured." >&2
            exit 1
          fi

          inventory_path="$RUNNER_TEMP/release-retention-inventory.json"
          rclone lsjson \
            --recursive \
            --files-only \
            --hash \
            --no-mimetype \
            "$RCLONE_REMOTE" > "$inventory_path"
          echo "path=$inventory_path" >> "$GITHUB_OUTPUT"
          echo "complete=true" >> "$GITHUB_OUTPUT"

      - name: Build deterministic retention plan
        env:
          MANIFEST_PATH: ${{ inputs.manifest }}
          POLICY_PATH: ${{ inputs.policy }}
          INVENTORY_PATH: ${{ steps.inventory.outputs.path }}
          AS_OF: ${{ inputs.as_of }}
          RCLONE_REMOTE: ${{ inputs.rclone_remote }}
          R2_PREFIX: ${{ inputs.r2_prefix }}
        run: |
          set -euo pipefail

          args=(
            --manifest "$MANIFEST_PATH"
            --policy "$POLICY_PATH"
            --format json
            --output retention-plan.json
          )

          if [ -n "$INVENTORY_PATH" ]; then
            args+=(--inventory "$INVENTORY_PATH")
          fi

          if [ -n "$AS_OF" ]; then
            args+=(--as-of "$AS_OF")
          fi

          if [ -n "$RCLONE_REMOTE" ]; then
            args+=(--rclone-remote "$RCLONE_REMOTE" --r2-prefix "$R2_PREFIX")
          fi

          python3 .release-infrastructure/scripts/release-retention/plan.py "${args[@]}"
          python3 -m json.tool retention-plan.json >/dev/null

      - name: Publish reviewed plan artifact
        id: publish
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-retention-plan
          path: retention-plan.json
          if-no-files-found: error

      - name: Compute plan digest
        id: digest
        run: |
          set -euo pipefail
          echo "sha256=$(python3 -c 'import json; print(json.load(open("retention-plan.json"))["plan_id"])')" >> "$GITHUB_OUTPUT"
